<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2980b9">
<title>Endotracheal Tube Size Calculator</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: white;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
  }
  h2 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 20px;
  }
  label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #34495e;
  }
  select, input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 16px;
  }
  button {
    width: 100%;
    margin-top: 25px;
    padding: 12px;
    background: #2980b9;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover {
    background: #1f6391;
  }
  .result {
    margin-top: 25px;
    padding: 15px;
    background: #ecf6ff;
    border-left: 5px solid #2980b9;
    border-radius: 6px;
    font-size: 18px;
    text-align: center;
    display: none;
  }
  .result span {
    font-weight: bold;
    color: #2980b9;
    font-size: 22px;
  }
  .note {
    font-size: 12px;
    color: #888;
    margin-top: 15px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <h2>ETT Calculator</h2>

  <label for="gender">Gender</label>
  <select id="gender">
    <option value="0">Male</option>
    <option value="1">Female</option>
  </select>

  <label for="height">Body Height (cm)</label>
  <input type="number" id="height" placeholder="e.g. 175" min="100" max="230">

  <button onclick="calculate()">Calculate</button>

  <div class="result" id="result">
    Recommended internal diameter (ID):<br>
    <span id="idValue"></span> mm
    <br><br>
    Nearest standard size: <span id="roundedValue"></span> mm
  </div>

  <div class="note">
    Formula: ID = 0.128×gender + 0.029×height + 2.06<br>
    Result is a guideline only – always use clinical judgment.
  </div>
</div>

<script>
function calculate() {
  const gender = parseFloat(document.getElementById('gender').value);
  const height = parseFloat(document.getElementById('height').value);

  if (isNaN(height) || height <= 0) {
    alert('Please enter a valid height.');
    return;
  }

  const id = 0.128 * gender + 0.029 * height + 2.06;

  // Standard tube sizes (0.5 mm steps)
  const standardSizes = [];
  for (let s = 5.0; s <= 9.0; s += 0.5) {
    standardSizes.push(s);
  }

  const rounded = standardSizes.reduce((prev, curr) =>
    Math.abs(curr - id) < Math.abs(prev - id) ? curr : prev
  );

  document.getElementById('idValue').innerText = id.toFixed(2);
  document.getElementById('roundedValue').innerText = rounded.toFixed(1);
  document.getElementById('result').style.display = 'block';
}
  
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
